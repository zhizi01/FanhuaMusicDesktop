<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: http://*.music.126.net https://*.music.126.net"
    />
    <title>Music Desktop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="backdrop" id="backdrop"></div>

    <main class="app">
      <header class="status" id="status" data-status="idle">
        <span class="dot"></span>
        <span class="status-text" id="statusText">初始化中...</span>
      </header>

      <section class="track">
        <div class="cover">
          <img id="cover" alt="" hidden />
          <svg class="cover-placeholder" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" /></svg>
        </div>
        <div class="meta">
          <div class="title" id="title">未在播放</div>
          <div class="artist" id="artist">—</div>
          <div class="album" id="album"></div>
        </div>
      </section>

      <section class="lyrics" id="lyrics">
        <div class="lyrics-inner" id="lyricsInner"></div>
      </section>

      <section class="progress">
        <div class="bar" id="bar">
          <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
          <div class="bar-thumb" id="barThumb"></div>
        </div>
        <div class="times">
          <span id="timeCur">00:00</span>
          <span id="timeDur">00:00</span>
        </div>
      </section>

      <section class="controls">
        <button class="ctl like" id="btnLike" data-cmd="toggleLike" title="喜欢">
          <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.6-9.3C.9 7.8 3.1 4 6.8 4c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.7 0 5.9 3.8 4.4 7.2-2.1 4.7-9.6 9.3-9.6 9.3z" /></svg>
        </button>
        <button class="ctl" data-cmd="prev" title="上一首">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z" /></svg>
        </button>
        <button class="ctl play" id="btnPlay" data-cmd="toggle" title="播放/暂停">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
          <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
        </button>
        <button class="ctl" data-cmd="next" title="下一首">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z" /></svg>
        </button>
        <span class="ctl-spacer"></span>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
