<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 繁花GG logo: a blooming flower whose heart is a vinyl record. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1f45" />
      <stop offset="0.55" stop-color="#1d1426" />
      <stop offset="1" stop-color="#120d18" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#ff7aa2" stop-opacity="0.38" />
      <stop offset="1" stop-color="#ff7aa2" stop-opacity="0" />
    </radialGradient>
    <!-- petal: gold tip fading into pink at the base (gradient follows each rotated petal) -->
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a" />
      <stop offset="0.55" stop-color="#ff9fbc" />
      <stop offset="1" stop-color="#ff5d8f" />
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a2230" />
      <stop offset="1" stop-color="#0f0b13" />
    </radialGradient>
    <path id="p" d="M512 500 C 418 404, 420 214, 512 132 C 604 214, 606 404, 512 500 Z" />
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)" />
  <rect width="1024" height="1024" rx="228" fill="url(#glow)" />

  <g opacity="0.94">
    <use href="#p" fill="url(#petal)" transform="rotate(0 512 512)" />
    <use href="#p" fill="url(#petal)" transform="rotate(60 512 512)" />
    <use href="#p" fill="url(#petal)" transform="rotate(120 512 512)" />
    <use href="#p" fill="url(#petal)" transform="rotate(180 512 512)" />
    <use href="#p" fill="url(#petal)" transform="rotate(240 512 512)" />
    <use href="#p" fill="url(#petal)" transform="rotate(300 512 512)" />
  </g>

  <!-- vinyl heart -->
  <circle cx="512" cy="512" r="150" fill="url(#disc)" stroke="#1a1220" stroke-width="10" />
  <g fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="4">
    <circle cx="512" cy="512" r="128" />
    <circle cx="512" cy="512" r="110" />
    <circle cx="512" cy="512" r="92" />
  </g>
  <path d="M430 450 A 104 104 0 0 1 574 430" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round" />
  <circle cx="512" cy="512" r="58" fill="url(#petal)" />
  <circle cx="512" cy="512" r="13" fill="#120d18" />
</svg>
